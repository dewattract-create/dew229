<title>สมุดเงินออม</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: ส่วนสรุปด้านบน, ซ้าย = ฟอร์ม + เป้าหมายออม, ขวา = รายการ + สัดส่วน (มือถือเรียงเป็นคอลัมน์เดียว) */
:root{
  --bg:#eef2f0; --surface:#fbfdfc; --line:#d5dedb; --fg:#16231f; --muted:#5d706a;
  --accent:#0f6b57; --accent-fg:#fff; --income:#1b7f4b; --expense:#c4452f; --saving:#2b6cb0;
  --track:#dfe7e4;
  --ui:'IBM Plex Sans Thai',system-ui,sans-serif; --num:'IBM Plex Mono',ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1a17; --surface:#16251f; --line:#27403a; --fg:#e6f0ec; --muted:#93aaa3;
  --accent:#3fc2a0; --accent-fg:#06211a; --income:#4cc58a; --expense:#f0806a; --saving:#7db4f2; --track:#223630; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1a17; --surface:#16251f; --line:#27403a; --fg:#e6f0ec; --muted:#93aaa3;
  --accent:#3fc2a0; --accent-fg:#06211a; --income:#4cc58a; --expense:#f0806a; --saving:#7db4f2; --track:#223630; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--ui);font-size:15px;line-height:1.5;
  padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1080px;margin:0 auto;display:grid;gap:16px}
h1{font-size:1.5rem;margin:0;font-weight:700;text-wrap:balance}
h2{font-size:1rem;margin:0 0 12px;font-weight:600}
.top{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap}
.top p{margin:0;color:var(--muted)}
.num{font-family:var(--num);font-variant-numeric:tabular-nums}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;min-width:0}
.stat small{color:var(--muted);display:block}
.stat b{font-size:1.4rem;display:block;overflow-wrap:anywhere}
.stat.main{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.stat.main small{color:inherit;opacity:.8}
.cols{display:grid;grid-template-columns:minmax(0,360px) minmax(0,1fr);gap:16px;align-items:start}
.stack{display:grid;gap:16px;min-width:0}
@media (max-width:820px){.stats{grid-template-columns:1fr 1fr}.cols{grid-template-columns:minmax(0,1fr)}}
label{display:block;font-size:.85rem;color:var(--muted);margin-bottom:4px}
input,select,button{font:inherit;color:inherit}
input,select{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);min-width:0}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.field{margin-bottom:10px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:12px}
.seg button{padding:8px 4px;border:1px solid var(--line);background:var(--bg);border-radius:8px;cursor:pointer;font-weight:500}
.seg button[aria-pressed="true"]{color:#fff;border-color:transparent}
.seg button[data-t="income"][aria-pressed="true"]{background:var(--income)}
.seg button[data-t="expense"][aria-pressed="true"]{background:var(--expense)}
.seg button[data-t="saving"][aria-pressed="true"]{background:var(--saving)}
.btn{width:100%;padding:10px;border:0;border-radius:8px;background:var(--accent);color:var(--accent-fg);font-weight:600;cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--line);width:auto;padding:6px 12px;font-weight:500}
.x{border:0;background:none;color:var(--muted);cursor:pointer;padding:4px 8px;border-radius:6px;font-size:1rem}
.x:hover{color:var(--expense)}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.bar input[type=month]{width:auto}
ul{list-style:none;margin:0;padding:0}
.tx{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.tx:first-child{border-top:0}
.tx .t{min-width:0}
.tx .t b{font-weight:500;display:block;overflow-wrap:anywhere}
.tx .t span{color:var(--muted);font-size:.82rem}
.amt{font-weight:600;text-align:right}
.income{color:var(--income)}.expense{color:var(--expense)}.saving{color:var(--saving)}
.empty{color:var(--muted);text-align:center;padding:20px 0}
.cat{display:grid;grid-template-columns:90px 1fr auto;gap:10px;align-items:center;margin:6px 0;font-size:.9rem}
.track{height:10px;background:var(--track);border-radius:5px;overflow:hidden}
.fill{height:100%;background:var(--expense);border-radius:5px}
.goal{padding:10px 0;border-top:1px solid var(--line)}
.goal:first-of-type{border-top:0}
.goal .h{display:flex;justify-content:space-between;gap:8px;align-items:center}
.goal .fill{background:var(--saving)}
.goal small{color:var(--muted)}
.theme{font-size:.85rem}
</style>

<div class="wrap">
  <div class="top">
    <div>
      <h1>สมุดเงินออม</h1>
      <p>จดรายรับ รายจ่าย และเงินสะสมของคุณ ข้อมูลเก็บในเบราว์เซอร์นี้</p>
    </div>
    <button class="btn ghost theme" id="theme" type="button">โหมดมืด/สว่าง</button>
  </div>

  <div class="stats" id="stats"></div>

  <div class="cols">
    <div class="stack">
      <form class="card" id="form">
        <h2>เพิ่มรายการ</h2>
        <div class="seg" id="seg">
          <button type="button" data-t="expense" aria-pressed="true">รายจ่าย</button>
          <button type="button" data-t="income" aria-pressed="false">รายรับ</button>
          <button type="button" data-t="saving" aria-pressed="false">ออมเงิน</button>
        </div>
        <div class="row2">
          <div class="field"><label for="amount">จำนวนเงิน (บาท)</label><input id="amount" type="number" min="0.01" step="0.01" inputmode="decimal" required></div>
          <div class="field"><label for="date">วันที่</label><input id="date" type="date" required></div>
        </div>
        <div class="field" id="catBox"><label for="cat">หมวดหมู่</label><select id="cat"></select></div>
        <div class="field" id="goalBox" hidden><label for="goal">เข้าเป้าหมายออม</label><select id="goal"></select></div>
        <div class="field"><label for="note">บันทึก (ไม่บังคับ)</label><input id="note" type="text" maxlength="80" placeholder="เช่น ข้าวกลางวัน"></div>
        <button class="btn" type="submit">บันทึก</button>
      </form>

      <div class="card">
        <h2>เป้าหมายเงินสะสม</h2>
        <div id="goals"></div>
        <form id="goalForm" class="row2" style="margin-top:12px">
          <div><label for="gname">ชื่อเป้าหมาย</label><input id="gname" type="text" maxlength="40" required placeholder="เช่น กองทุนฉุกเฉิน"></div>
          <div><label for="gtarget">เป้า (บาท)</label><input id="gtarget" type="number" min="1" step="1" required></div>
          <button class="btn" style="grid-column:1/-1" type="submit">เพิ่มเป้าหมาย</button>
        </form>
      </div>
    </div>

    <div class="stack">
      <div class="card">
        <div class="bar">
          <h2 style="margin:0">รายการ</h2>
          <input id="month" type="month" aria-label="เลือกเดือน">
          <button class="btn ghost" id="all" type="button">ทั้งหมด</button>
        </div>
        <ul id="list"></ul>
      </div>
      <div class="card">
        <h2>รายจ่ายแยกตามหมวด</h2>
        <div id="cats"></div>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
  var KEY='sammud-ngoen-om-v1';
  var EXP=['อาหาร','เดินทาง','ที่พัก','ของใช้','บันเทิง','สุขภาพ','การศึกษา','อื่นๆ'];
  var INC=['เงินเดือน','รายได้เสริม','โบนัส','ของขวัญ','อื่นๆ'];
  var state={tx:[],goals:[]}, type='expense', filter=ym(new Date());
  var $=function(id){return document.getElementById(id)};

  function load(){try{var s=JSON.parse(localStorage.getItem(KEY));if(s&&s.tx&&s.goals)return s}catch(e){}return null}
  function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
  function ym(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')}
  function today(){var d=new Date();return ym(d)+'-'+String(d.getDate()).padStart(2,'0')}
  function fmt(n){return n.toLocaleString('th-TH',{minimumFractionDigits:2,maximumFractionDigits:2})}
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
  function dstr(s){var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2]).toLocaleDateString('th-TH',{day:'numeric',month:'short',year:'2-digit'})}

  var stored=load();
  if(stored){state=stored}else{
    // ตัวอย่างเริ่มต้น ลบได้
    var m=ym(new Date()), g=uid();
    state.goals=[{id:g,name:'กองทุนฉุกเฉิน (ตัวอย่าง)',target:30000}];
    state.tx=[
      {id:uid(),type:'income',amount:25000,date:m+'-01',cat:'เงินเดือน',note:'ตัวอย่าง'},
      {id:uid(),type:'expense',amount:3500,date:m+'-02',cat:'ที่พัก',note:'ค่าเช่า (ตัวอย่าง)'},
      {id:uid(),type:'expense',amount:120,date:m+'-03',cat:'อาหาร',note:'ข้าวกลางวัน (ตัวอย่าง)'},
      {id:uid(),type:'saving',amount:5000,date:m+'-03',cat:'ออมเงิน',goal:g,note:'ฝากรอบแรก (ตัวอย่าง)'}
    ];
  }

  function sum(list,t){return list.filter(function(x){return x.type===t}).reduce(function(a,x){return a+x.amount},0)}
  function inView(x){return !filter||x.date.slice(0,7)===filter}

  function fillCat(){
    var o=(type==='income'?INC:EXP).map(function(c){return '<option>'+c+'</option>'}).join('');
    $('cat').innerHTML=o;
    $('catBox').hidden=type==='saving';
    $('goalBox').hidden=type!=='saving';
    $('goal').innerHTML='<option value="">ไม่ระบุเป้าหมาย</option>'+state.goals.map(function(g){return '<option value="'+g.id+'">'+esc(g.name)+'</option>'}).join('');
  }

  function render(){
    var all=state.tx, v=all.filter(inView);
    var savedAll=sum(all,'saving');
    var balance=sum(all,'income')-sum(all,'expense')-savedAll;
    $('stats').innerHTML=
      '<div class="stat main"><small>เงินสะสมทั้งหมด</small><b class="num">฿'+fmt(savedAll)+'</b></div>'+
      '<div class="stat"><small>รายรับ'+(filter?'เดือนนี้':'ทั้งหมด')+'</small><b class="num income">฿'+fmt(sum(v,'income'))+'</b></div>'+
      '<div class="stat"><small>รายจ่าย'+(filter?'เดือนนี้':'ทั้งหมด')+'</small><b class="num expense">฿'+fmt(sum(v,'expense'))+'</b></div>'+
      '<div class="stat"><small>เงินคงเหลือ (ไม่รวมที่ออม)</small><b class="num">฿'+fmt(balance)+'</b></div>';

    var rows=v.slice().sort(function(a,b){return b.date.localeCompare(a.date)||b.id.localeCompare(a.id)});
    $('list').innerHTML=rows.length?rows.map(function(x){
      var sign=x.type==='expense'?'-':'+';
      var g=x.goal&&state.goals.find(function(g){return g.id===x.goal});
      var label=x.type==='saving'?('ออมเงิน'+(g?' · '+esc(g.name):'')):esc(x.cat);
      return '<li class="tx"><div class="t"><b>'+(x.note?esc(x.note):label)+'</b><span>'+dstr(x.date)+' · '+(x.note?label:'')+'</span></div>'+
        '<div class="amt num '+x.type+'">'+sign+fmt(x.amount)+'</div>'+
        '<button class="x" data-del="'+x.id+'" aria-label="ลบรายการ">✕</button></li>';
    }).join(''):'<li class="empty">ยังไม่มีรายการในช่วงนี้ เพิ่มรายการแรกได้ที่ฟอร์ม</li>';

    var byCat={}; v.filter(function(x){return x.type==='expense'}).forEach(function(x){byCat[x.cat]=(byCat[x.cat]||0)+x.amount});
    var ents=Object.keys(byCat).map(function(k){return[k,byCat[k]]}).sort(function(a,b){return b[1]-a[1]});
    var tot=ents.reduce(function(a,e){return a+e[1]},0);
    $('cats').innerHTML=ents.length?ents.map(function(e){
      return '<div class="cat"><span>'+esc(e[0])+'</span><div class="track"><div class="fill" style="width:'+(e[1]/tot*100).toFixed(1)+'%"></div></div><span class="num">'+fmt(e[1])+'</span></div>';
    }).join(''):'<div class="empty">ยังไม่มีรายจ่าย</div>';

    $('goals').innerHTML=state.goals.length?state.goals.map(function(g){
      var s=all.filter(function(x){return x.goal===g.id}).reduce(function(a,x){return a+x.amount},0);
      var p=Math.min(100,s/g.target*100);
      return '<div class="goal"><div class="h"><b>'+esc(g.name)+'</b><button class="x" data-delgoal="'+g.id+'" aria-label="ลบเป้าหมาย">✕</button></div>'+
        '<div class="track"><div class="fill" style="width:'+p.toFixed(1)+'%"></div></div>'+
        '<small class="num">฿'+fmt(s)+' / ฿'+fmt(g.target)+' ('+p.toFixed(0)+'%)</small></div>';
    }).join(''):'<div class="empty">ยังไม่มีเป้าหมาย ตั้งเป้าแรกด้านล่าง</div>';
  }

  $('seg').addEventListener('click',function(e){
    var b=e.target.closest('button');if(!b)return;
    type=b.dataset.t;
    [].forEach.call($('seg').children,function(c){c.setAttribute('aria-pressed',c===b)});
    fillCat();
  });
  $('form').addEventListener('submit',function(e){
    e.preventDefault();
    var a=parseFloat($('amount').value);if(!(a>0))return;
    state.tx.push({id:uid(),type:type,amount:a,date:$('date').value,
      cat:type==='saving'?'ออมเงิน':$('cat').value,goal:type==='saving'?$('goal').value:'',note:$('note').value.trim()});
    $('amount').value='';$('note').value='';
    save();render();$('amount').focus();
  });
  $('goalForm').addEventListener('submit',function(e){
    e.preventDefault();
    var t=parseFloat($('gtarget').value);if(!(t>0))return;
    state.goals.push({id:uid(),name:$('gname').value.trim(),target:t});
    $('gname').value='';$('gtarget').value='';
    save();fillCat();render();
  });
  document.addEventListener('click',function(e){
    var d=e.target.closest('[data-del]'),g=e.target.closest('[data-delgoal]');
    if(d){state.tx=state.tx.filter(function(x){return x.id!==d.dataset.del});save();render()}
    if(g){state.goals=state.goals.filter(function(x){return x.id!==g.dataset.delgoal});
      state.tx.forEach(function(x){if(x.goal===g.dataset.delgoal)x.goal=''});save();fillCat();render()}
  });
  $('month').value=filter;
  $('month').addEventListener('change',function(){filter=this.value;render()});
  $('all').addEventListener('click',function(){filter='';$('month').value='';render()});
  $('theme').addEventListener('click',function(){
    var r=document.documentElement,dark=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;
    r.dataset.theme=dark?'light':'dark';
  });
  $('date').value=today();
  fillCat();render();
})();
</script>
